[package]
name = "lumencat"
version = "0.1.0"
edition = "2024"
default-run = "lumencat"

[dependencies]
eframe = { version = "=0.32.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }
rusqlite = { version = "=0.37.0", features = ["bundled", "backup", "hooks"] }
quick-xml = "=0.38.3"
unicode-normalization = "=0.1.23"
strsim = "=0.11.1"
tempfile = "=3.23.0"
zip = { version = "=4.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "registry"] }
gpui = "0.2.2"
async-channel = "2.5.0"
rfd = "0.17.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[[example]]
name = "verify_docx"
path = "scripts/utils/verify_docx.rs"

[[example]]
name = "verify_grid"
path = "scripts/utils/verify_grid.rs"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
